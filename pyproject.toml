[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "privesc-audit"
version = "0.3.0"
description = "Read-only Linux privilege-escalation audit and hardening scanner for authorized assessments."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Defa Mulya Pratama" }]
keywords = ["security", "linux", "hardening", "audit", "privilege-escalation", "blue-team", "pentest"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []  # zero runtime dependencies: runs anywhere Python 3.8+ is present

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/defamp/privesc-audit"

[project.scripts]
privesc-audit = "privesc_audit.cli:main"

[tool.setuptools.packages.find]
include = ["privesc_audit*"]
